name: Release Windows

on:
  push:
    tags:
      - "v*"
  # Allows publishing from a tag that already exists, without moving the tag: pushing the
  # tag again would re-trigger the Linux workflow, re-uploading the Linux artifacts.
  # Running this workflow with ref=homolog and build_ref=v0.1.4 builds the tag and publishes.
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Tag ou commit a buildar (vazio = o proprio ref disparado)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build & publish (NSIS x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish to GitHub Releases
        run: npm run desktop:build:windows:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, re-running the workflow more than 2h after the publication makes
          # electron-builder silently skip the upload (release too "old").
          EP_GH_IGNORE_TIME: "true"
