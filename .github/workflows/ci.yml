name: CI

on:
  push:
    branches: [homolog, master]
  pull_request:

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Runs with --max-warnings 0 in both workspaces, so it only fails on
      # something introduced by the change under review.
      - name: Lint
        run: npm run lint
