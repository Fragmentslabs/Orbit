name: CI

on:
  push:
    branches: [homolog, master]
  pull_request:

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `npm run lint` ainda não passa no repositório (erros e avisos
      # pré-existentes), então fica fora do gate por enquanto — ligar aqui
      # quebraria todo PR por dívida que não é dele.
