<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory review — Orbit</title>
<style>
  :root {
    --bg: #131316; --card: #1c1c21; --line: #2c2c33; --fg: #e9e9ee;
    --muted: #9a9aa6; --primary: #e0b341; --ok: #59b986; --warn: #d98b4a; --danger: #d96b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(19,19,22,.94);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: #41414a; }
  button.primary { background: var(--primary); color: #1a1a1a; border-color: var(--primary); font-weight: 600; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 9px; }
  .pill.on { color: #1a1a1a; background: var(--primary); border-color: var(--primary); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .tag.warn { color: var(--warn); border-color: #4a3a2a; }
  .tag.ok { color: var(--ok); border-color: #2c4438; }
  .anchor { background: #16161a; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    margin-bottom: 16px; white-space: pre-wrap; word-break: break-word; font-size: 13px; color: #cfcfd8;
    max-height: 220px; overflow: auto; }
  .anchor.neg { border-color: #4a2f2f; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  textarea, input[type=text] { width: 100%; background: #16161a; color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--primary); }
  textarea.q { min-height: 64px; }
  textarea.ctx { min-height: 54px; }
  .decisions { display: flex; gap: 8px; flex-wrap: wrap; }
  .decisions label { margin: 0; color: var(--fg); font-size: 13px; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; display: flex; gap: 7px; align-items: center; }
  .decisions label:has(input:checked) { border-color: var(--primary); background: #262218; }
  .decisions input { accent-color: var(--primary); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  footer { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  .count { font-size: 12px; color: var(--muted); }
  .done { color: var(--ok); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .warnbox { border: 1px solid #4a3a2a; background: #241d15; color: #e8c79a; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
  kbd { background: #26262d; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Memory review</h1>
  <span class="pill" id="filterPilot">Pilot (20)</span>
  <span class="pill" id="filterAll">All (50)</span>
  <span class="spacer"></span>
  <span class="count" id="progress"></span>
  <button class="ghost" id="importBtn">Import</button>
  <button class="primary" id="exportBtn">Export labels</button>
</header>
<main>
  <div class="warnbox">
    Everything here runs on your computer. Write the query the way you would actually ask it — do not copy
    words from the memory. Mark <strong>inconclusive</strong> when the case is ambiguous.
  </div>
  <div class="card" id="card"></div>
  <footer>
    <button id="prevBtn">← Previous</button>
    <button id="nextBtn">Next →</button>
    <span class="spacer"></span>
    <span class="count">Shortcuts: <kbd>&#8984;&#9166;</kbd> next · <kbd>&#8984;&#8679;I</kbd> inconclusive</span>
  </footer>
</main>
<input type="file" id="fileInput" accept="application/json" hidden>
<script>
const DATA = __ORBIT_DATA__;
const KEY = 'orbit-memory-review-v2';
const DECISIONS = [
  ['inject', 'Full content', 'The memory answers the question or is indispensable to answer it.'],
  ['pointer', 'Just a pointer', 'It helps, but is not indispensable — the model can open it.'],
  ['none', 'No memory', 'The question needs nothing from what is stored.'],
  ['inconclusive', 'Inconclusive', 'Too ambiguous to label.'],
];

// The classification of the review schema maps back to the page's decision when a
// label file is imported. `inject` and `pointer` both count as `relevant`: either way
// the memory is the right one to retrieve.
const DECISION = { relevant: 'inject', irrelevant: 'none', inconclusive: 'inconclusive' };

let state = load();
let filter = 'pilot';
let index = 0;

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch {}
  return { v: 1, labels: {} };
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function labels() { return state.labels || (state.labels = {}); }
function current() {
  const list = visible();
  if (!list.length) return null;
  if (index >= list.length) index = list.length - 1;
  return list[index];
}
function visible() {
  return DATA.scenarios.filter((s) => filter === 'all' || s.pilot);
}
function blankLabel(label) {
  return label || { query: '', context: '', decision: '', reason: '' };
}
function answered(id) {
  const l = labels()[id];
  return !!(l && l.query.trim() && l.decision);
}

function render() {
  const list = visible();
  const card = document.getElementById('card');
  document.getElementById('filterPilot').className = 'pill' + (filter === 'pilot' ? ' on' : '');
  document.getElementById('filterAll').className = 'pill' + (filter === 'all' ? ' on' : '');
  const done = list.filter((s) => answered(s.id)).length;
  document.getElementById('progress').textContent = `${done}/${list.length} answered`;

  if (!list.length) { card.innerHTML = '<div class="empty">No scenario in this filter.</div>'; return; }
  const s = current();
  const l = blankLabel(labels()[s.id]);
  const neg = s.role === 'no-memory';

  card.innerHTML = `
    <div class="meta">
      <span class="tag">${s.id}</span>
      <span class="tag">${neg ? 'related topic — should NOT be retrieved' : 'target memory'}</span>
      <span class="tag">${s.kind}${s.category ? ' · ' + s.category : ''}${s.area ? ' · ' + s.area : ''}</span>
      <span class="tag">${s.length}</span>
      ${s.similar ? '<span class="tag warn">similar to others</span>' : ''}
      ${s.crossLang ? '<span class="tag ok">suggested: query in another language</span>' : ''}
      ${s.memoryId ? '<span class="tag">' + s.memoryId + '</span>' : ''}
    </div>
    <label>${neg ? 'Topic memory (just so you can frame the question)' : 'Memory that should be found'}</label>
    <div class="anchor ${neg ? 'neg' : ''}">${escapeHtml(s.text || '(no text)')}</div>
    <label for="q">Your question, as you would ask an assistant</label>
    <textarea id="q" class="q" placeholder="e.g.: I need to plan next month's trip, what do you remember about how I like to travel?">${escapeHtml(l.query)}</textarea>
    <label for="c">Recent context (optional — only if the question depends on it)</label>
    <textarea id="c" class="ctx" placeholder="e.g.: user: I am booking the trip to Recife / assistant: do you prefer leaving in the morning or at night?">${escapeHtml(l.context)}</textarea>
    <label>Correct outcome for this question</label>
    <div class="decisions">
      ${DECISIONS.map(([v, t]) => `<label title="${t}"><input type="radio" name="d" value="${v}" ${l.decision === v ? 'checked' : ''}> ${t}</label>`).join('')}
    </div>
    <div class="hint">${neg ? 'Here the expected outcome is usually <strong>No memory</strong> — but decide by what the question asks.' : 'Metadata suggestion: <strong>' + s.suggested + '</strong>. Fix it if it does not make sense.'}</div>
    <label for="r">Short reason (one line)</label>
    <input type="text" id="r" placeholder="e.g.: the question is about the topic, but does not need my fact" value="${escapeAttr(l.reason)}">
  `;

  const q = card.querySelector('#q');
  const c = card.querySelector('#c');
  const r = card.querySelector('#r');
  const set = (patch) => { labels()[s.id] = Object.assign(blankLabel(labels()[s.id]), patch); save(); updateProgress(); };
  q.addEventListener('input', () => set({ query: q.value }));
  c.addEventListener('input', () => set({ context: c.value }));
  r.addEventListener('input', () => set({ reason: r.value }));
  card.querySelectorAll('input[name=d]').forEach((el) =>
    el.addEventListener('change', () => { set({ decision: el.value }); }));
  q.focus();
}

function updateProgress() {
  const list = visible();
  document.getElementById('progress').textContent =
    `${list.filter((s) => answered(s.id)).length}/${list.length} answered`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function escapeAttr(s) { return escapeHtml(s); }

function go(delta) {
  const list = visible();
  index = Math.max(0, Math.min(list.length - 1, index + delta));
  render();
}

document.getElementById('filterPilot').onclick = () => { filter = 'pilot'; index = 0; render(); };
document.getElementById('filterAll').onclick = () => { filter = 'all'; index = 0; render(); };
document.getElementById('prevBtn').onclick = () => go(-1);
document.getElementById('nextBtn').onclick = () => go(1);

// ---------------------------------------------------------------------------
// Export — the label file `eval` reads (see review.test.ts: LabelsFile)
// ---------------------------------------------------------------------------

function buildExport() {
  const store = labels();
  return {
    v: 1,
    exportedAt: new Date().toISOString(),
    corpus: DATA.corpus,
    pilot: DATA.scenarios.filter((s) => s.pilot).map((s) => s.id),
    labels: DATA.scenarios.map((s) => {
      const l = blankLabel(store[s.id]);
      return {
        id: s.id, memoryId: s.memoryId, role: s.role, pilot: !!s.pilot,
        stratum: `${s.kind}/${s.category || '-'}/${s.length}${s.crossLang ? '/cross' : ''}`,
        query: l.query, context: l.context, decision: l.decision, reason: l.reason,
      };
    }).filter((l) => l.query.trim() || l.decision),
  };
}

function downloadFile(json) {
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'labels.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    return true;
  } catch (e) { return false; }
}

function showExport(json, n) {
  const old = document.getElementById('exportPanel');
  if (old) old.remove();
  const wrap = document.createElement('div');
  wrap.id = 'exportPanel';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px';
  const box = document.createElement('div');
  box.style.cssText = 'background:#16181d;color:#e8e8ea;border:1px solid #2a2d34;border-radius:12px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;gap:12px;padding:16px;font:14px/1.4 -apple-system,system-ui,sans-serif';
  const h = document.createElement('div');
  h.style.cssText = 'font-size:13px;color:#a9adb7;line-height:1.5';
  h.innerHTML = n
    ? '<strong>' + n + ' scenario(s) in the export.</strong> Copy the text below and save it as <code>labels.json</code> in <code>~/.orbit-memory-review/</code>.'
    : '<strong>Nothing answered yet.</strong> Fill in at least the query or the decision — otherwise the export comes out empty.';
  const ta = document.createElement('textarea');
  ta.value = json;
  ta.readOnly = true;
  ta.style.cssText = 'width:100%;height:46vh;background:#0f1115;color:#cfd3da;border:1px solid #2a2d34;border-radius:8px;padding:10px;font:12px/1.45 ui-monospace,Menlo,monospace;resize:vertical';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap';
  const mk = (txt, fn, primary) => {
    const b = document.createElement('button');
    b.textContent = txt;
    b.style.cssText = 'cursor:pointer;border-radius:8px;padding:8px 14px;font:13px -apple-system,system-ui,sans-serif;border:1px solid ' + (primary ? '#d6b24a' : '#2a2d34') + ';background:' + (primary ? '#d6b24a' : 'transparent') + ';color:' + (primary ? '#1a1a1a' : '#cfd3da');
    b.onclick = fn;
    return b;
  };
  row.appendChild(mk('Download file', function () { if (!downloadFile(json)) alert('The browser blocked the download — use Copy.'); }, false));
  row.appendChild(mk('Copy', async function () {
    ta.focus(); ta.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(json);
      else document.execCommand('copy');
      row.querySelectorAll('button').forEach(function (b) { if (b.textContent === 'Copy') b.textContent = 'Copied'; });
    } catch (e) { try { document.execCommand('copy'); } catch (e2) {} }
  }, true));
  row.appendChild(mk('Close', function () { wrap.remove(); }, false));
  box.appendChild(h); box.appendChild(ta); box.appendChild(row);
  wrap.appendChild(box);
  wrap.addEventListener('click', function (e) { if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
  ta.focus(); ta.select();
}

document.getElementById('exportBtn').onclick = () => {
  const out = buildExport();
  const json = JSON.stringify(out, null, 2);
  downloadFile(json);
  showExport(json, out.queries.length);
};

// ---------------------------------------------------------------------------
// Import — reads the English schema and the older Portuguese keys, which is what
// an existing `rotulos.json` on this machine carries (`consultas`, `esperado`
// with `recuperar` / `nenhuma`, `memorias`, `hibrido`, `cobertura`, `obs`).
// ---------------------------------------------------------------------------

function firstOf(object, ...keys) {
  if (!object) return undefined;
  for (const key of keys) if (object[key] !== undefined) return object[key];
  return undefined;
}

function asObject(value) {
  return value && typeof value === 'object' ? value : null;
}

/** `cobertura` → `coverage`; the rest of the hit keeps the same name. */
function normalizeHits(value) {
  const raw = asObject(value);
  const list = raw && Array.isArray(raw.top5) ? raw.top5 : null;
  if (!list) return null;
  return {
    top5: list.map((hit) => {
      const h = asObject(hit) || {};
      const out = { rank: Number(h.rank), id: String(h.id) };
      const score = firstOf(h, 'score');
      if (score !== undefined) out.score = score;
      const cos = firstOf(h, 'cos');
      if (cos !== undefined) out.cos = cos;
      const coverage = firstOf(h, 'coverage', 'cobertura');
      if (coverage !== undefined) out.coverage = coverage;
      return out;
    }),
  };
}

/** A label file written elsewhere may use other query ids — fall back to the memory. */
function scenarioOf(query) {
  const direct = DATA.scenarios.find((s) => s.id === query.id);
  if (direct) return direct;
  const memoryIds = [];
  const derived = firstOf(query, 'derivedFrom');
  if (derived) memoryIds.push(String(derived));
  const memories = asObject(firstOf(query, 'memories', 'memorias'));
  if (memories) for (const id of Object.keys(memories)) memoryIds.push(id);
  const matches = DATA.scenarios.filter((s) => s.memoryId && memoryIds.indexOf(s.memoryId) >= 0);
  return matches.length === 1 ? matches[0] : null;
}

function importQueries(list) {
  for (const raw of list) {
    const query = asObject(raw);
    if (!query || !query.id) continue;
    const scenario = scenarioOf(query);
    const key = scenario ? scenario.id : String(query.id);

    const memories = asObject(firstOf(query, 'memories', 'memorias'));
    const ids = memories ? Object.keys(memories) : [];
    // The batch labels one memory per scenario: prefer that one, then any other
    // memory the file already judged.
    const own = scenario && scenario.memoryId && memories ? scenario.memoryId : null;
    const order = own ? [own].concat(ids.filter((id) => id !== own)) : ids;

    let decision = '';
    let notes = '';
    for (const id of order) {
      const entry = asObject(memories[id]) || {};
      const classification = String(firstOf(entry, 'classification', 'classificacao') || '').trim();
      if (!classification) continue;
      decision = DECISION[classification] || '';
      notes = String(firstOf(entry, 'notes', 'obs') || '');
      break;
    }

    labels()[key] = {
      query: String(firstOf(query, 'text', 'query') || ''),
      context: String(firstOf(query, 'context') || ''),
      decision,
      reason: notes,
      lexical: normalizeHits(firstOf(query, 'lexical')),
      hybrid: normalizeHits(firstOf(query, 'hybrid', 'hibrido')),
    };
  }
}

/** The page's own export from before the schema translation (`labels[]`). */
function importLegacyLabels(list) {
  for (const raw of list) {
    const l = asObject(raw);
    if (!l || !l.id) continue;
    labels()[l.id] = {
      query: l.query || '', context: l.context || '',
      decision: l.decision || '', reason: l.reason || '',
    };
  }
}

function importFile(text) {
  const data = JSON.parse(text);
  if (Array.isArray(data)) { importQueries(data); return; }
  const list = asObject(data);
  if (!list) throw new Error('unexpected file');
  const queries = firstOf(list, 'queries', 'consultas');
  if (Array.isArray(queries)) { importQueries(queries); return; }
  if (Array.isArray(list.labels)) { importLegacyLabels(list.labels); return; }
  throw new Error('no "queries" list found');
}

document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      importFile(String(reader.result));
      save(); render();
    } catch (err) { alert('Invalid file: ' + err.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
};

document.addEventListener('keydown', (ev) => {
  const meta = ev.metaKey || ev.ctrlKey;
  if (!meta) return;
  if (ev.key === 'Enter') { ev.preventDefault(); go(1); }
  if (ev.shiftKey && (ev.key === 'i' || ev.key === 'I')) {
    ev.preventDefault();
    const s = current(); if (!s) return;
    labels()[s.id] = Object.assign(blankLabel(labels()[s.id]), { decision: 'inconclusive' });
    save(); render(); go(1);
  }
});

render();
</script>
</body>
</html>
