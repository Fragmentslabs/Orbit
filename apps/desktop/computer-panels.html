<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — Computer</title>
    <script>
      // Same theme as the app before the first paint; the background stays transparent —
      // the window covers the whole screen and only the panels show.
      ;(function () {
        try {
          var stored = localStorage.getItem('vite-ui-theme')
          var theme = stored === 'dark' || stored === 'light' ? stored : null
          if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.classList.add(theme)
        } catch (e) {
          /* best-effort: the ThemeProvider applies the theme anyway */
        }
      })()
    </script>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
        overflow: hidden;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/computer-panels-main.tsx"></script>
  </body>
</html>
