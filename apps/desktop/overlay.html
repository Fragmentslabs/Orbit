<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — Overlay</title>
    <script>
      // Same theme as the app before the first paint. The background is transparent: the
      // window is the panel, and what is behind it is the desktop.
      ;(function () {
        try {
          var stored = localStorage.getItem('vite-ui-theme')
          var theme = stored === 'dark' || stored === 'light' ? stored : null
          if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.classList.add(theme)
        } catch (e) {
          /* best-effort */
        }
      })()
    </script>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
        overflow: hidden;
        height: 100%;
        margin: 0;
      }
      /* The window is draggable only by the gap of the panel; the content is not. */
      body {
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay-main.tsx"></script>
  </body>
</html>
