<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <script>
      // Applies the theme before the first paint: the ThemeProvider only runs after
      // React mounts (too late) and the default CSS is light — without this the
      // window paints white for a few frames on open.
      ;(function () {
        try {
          var stored = localStorage.getItem('vite-ui-theme')
          var theme = stored === 'dark' || stored === 'light' ? stored : null
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          var root = document.documentElement
          root.classList.add(theme)
          root.style.backgroundColor = theme === 'dark' ? '#09090b' : '#ffffff'
        } catch (e) {
          /* best-effort: the ThemeProvider applies the theme anyway */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
